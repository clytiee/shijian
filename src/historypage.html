<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>历史记录 · 元素图文·时见</title>
<style>
  :root { --ink:#1e293b; --muted:#94a3b8; --line:#e2e8f0; --bg:#f8fafc; --accent:#2c3e66; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: system-ui, "Microsoft YaHei", sans-serif; }
  header { position: sticky; top:0; z-index:5; background:#fff; border-bottom:1px solid var(--line); padding:12px 16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:15px; font-weight:600; letter-spacing:.5px; }
  header .count { color:var(--muted); font-size:12px; }
  input[type=search] { flex:1 1 240px; min-width:180px; height:28px; padding:0 10px; border:1px solid #cbd5e1; border-radius:6px; font-size:13px; }
  button { height:26px; padding:0 10px; border:1px solid #cbd5e1; border-radius:6px; background:#fff; color:#475569; font-size:12px; cursor:pointer; }
  button:hover { background:#f1f5f9; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary:hover { background:#1e2c4d; }
  .modes { display:inline-flex; align-items:center; gap:10px; font-size:12px; color:#475569; padding:0 8px; }
  .modes-label { color:#94a3b8; }
  .modes label { display:inline-flex; align-items:center; gap:4px; cursor:pointer; }
  main { padding:12px 16px 40px; }
  .empty { color:var(--muted); font-size:13px; padding:40px 0; text-align:center; }
  .item { background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:10px; }
  .item .top { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .item .title { font-size:14px; font-weight:600; }
  .item .title.has-url { cursor:pointer; border-bottom:1px dashed #cbd5e1; }
  .item .title.has-url:hover { color:#2563eb; border-bottom-color:#2563eb; }
  .item .author { font-size:12px; color:#64748b; }
  .item .time { font-size:11px; color:var(--muted); margin-left:auto; font-variant-numeric: tabular-nums; }
  .item .tag { font-size:11px; color:#2563eb; background:#eff6ff; border:1px solid #dbeafe; border-radius:4px; padding:0 5px; }
  .item .preview { margin:6px 0 0; font-size:12px; color:#64748b; line-height:1.6; max-height:3.2em; overflow:hidden; white-space:pre-wrap; }
  .item .ops { margin-top:8px; display:flex; gap:8px; }
  .item .ops .spacer { flex:1 1 auto; }
  .item .ops button.danger { color:#b91c1c; border-color:#fecaca; }
  .item .ops button.danger:hover { background:#fef2f2; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#1e293b; color:#fff; padding:8px 16px; border-radius:999px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s; }
  .toast.show { opacity:1; }
</style>
</head>
<body>
<header>
  <h1>历史记录</h1>
  <span class="count" id="count"></span>
  <input type="search" id="q" placeholder="搜索标题 / 作者 / 正文">
  <span class="modes" title="选择在什么操作时自动写入历史记录">
    <span class="modes-label">记录时机</span>
    <label><input type="checkbox" id="mode-print"> 打印/下载图片</label>
    <label><input type="checkbox" id="mode-extract"> 提取</label>
  </span>
  <button id="clear-all" class="primary">清空全部</button>
</header>
<main id="list"><div class="empty">加载中…</div></main>
<div class="toast" id="toast"></div>

<script src="historypage.js"></script>
</body>
</html>
