<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>全部字体元数据</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; padding: 16px 20px; font-family: system-ui, "Microsoft YaHei", sans-serif; background: #f8fafc; color: #1e293b; text-align: center; }
  /* 大屏下整块内容居中：内容宽度随表格自适应，窄屏时仍从左侧开始 */
  .wrap { display: inline-block; text-align: left; max-width: 100%; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .hint { font-size: 12px; color: #64748b; margin: 0 0 12px; line-height: 1.7; }
  .bar { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  input { height: 28px; padding: 0 10px; font-size: 12px; border: 1px solid #cbd5e1; border-radius: 6px; min-width: 300px; }
  button { height: 28px; padding: 0 12px; font-size: 12px; border: 1px solid #cbd5e1; background: #fff; border-radius: 6px; cursor: pointer; }
  button:hover { background: #f1f5f9; }
  button.primary { background: #1e293b; color: #fff; border-color: #1e293b; }
  .count { font-size: 12px; color: #475569; }
  table { width: max-content; border-collapse: collapse; font-size: 12px; background: #fff; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; white-space: nowrap; }
  td.ps, th.ps { width: 130px; max-width: 130px; white-space: normal; word-break: break-all; }
  td.sty, th.sty { width: 72px; max-width: 72px; white-space: normal; word-break: break-word; }
  th { position: sticky; top: 0; background: #f1f5f9; color: #475569; z-index: 2; }
  th.sortable { cursor: pointer; user-select: none; padding-right: 18px; position: sticky; }
  th.sortable:hover { background: #e2e8f0; }
  th.sortable .arrow { position: absolute; right: 6px; color: #94a3b8; font-size: 10px; }
  th.sortable.sorted { color: #1e293b; }
  th.sortable.sorted .arrow { color: #1e293b; }
  .mono { font-family: ui-monospace, Consolas, monospace; font-size: 11px; color: #64748b; }
  .disp { font-size: 14px; }
  .sample { font-size: 32px; white-space: nowrap; color: #1e293b; }
  button.use { height: 24px; padding: 0 10px; border-color: #1e293b; background: #1e293b; color: #fff; white-space: nowrap; }
  th:last-child, td:last-child { width: 1%; white-space: nowrap; }
  button.use:hover { background: #334155; }
  tr.row:hover { background: #e2e8f0; }
  tr.grp td { background: #f8fafc; color: #64748b; font-size: 12px; font-weight: 600; letter-spacing: .5px; }
  .empty { padding: 24px; text-align: center; color: #94a3b8; font-size: 13px; }
  .han { white-space: nowrap; font-size: 12px; }
  .han .sub { display: block; font-size: 9px; color: #94a3b8; }
  .han.ok { color: #15803d; }
  .han.mid { color: #b45309; }
  .han.low { color: #94a3b8; }
  .han.dim { color: #cbd5e1; }
  button:disabled { opacity: .5; cursor: default; }
  .chk { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: #475569; cursor: pointer; user-select: none; }
  .chk input { height: auto; min-width: 0; margin: 0; cursor: pointer; }
  .err { color: #b91c1c; font-size: 12px; }
  .env { font-size: 11px; color: #94a3b8; margin-bottom: 10px; line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">
<h1>全部字体元数据</h1>
<p class="hint">
  点「读取系统字体」实时读本机字体（会弹授权），点末列「使用」关闭本页并把该字体应用到预览面板。表格只显示接口返回的真实值，不做兜底。
</p>
<div class="env" id="env"></div>
<div class="bar">
  <button class="primary" id="btn-read">读取系统字体</button>
  <button id="btn-analyze" title="解析每个字体文件的 cmap，统计常用 3500 字覆盖率">检测汉字</button>
  <label class="chk"><input type="checkbox" id="hide-en" checked>隐藏英文字体</label>
  <input id="q" placeholder="过滤 family / fullName / postscript / style / 显示名">
  <span class="count" id="cnt"></span>
  <span class="count" id="src"></span>
  <span class="err" id="err"></span>
</div>
<table>
  <thead><tr>
    <th class="sortable" data-sort="family">family</th>
    <th class="sortable" data-sort="fullName">fullName</th>
    <th class="sortable" data-sort="display">显示名</th>
    <th>预览</th>
    <th class="sortable ps" data-sort="postscriptName">postscriptName</th>
    <th class="sortable sty" data-sort="style">style</th>
    <th class="sortable" data-sort="han">常用字</th>
    <th>使用</th>
  </tr></thead>
  <tbody id="tb"></tbody>
</table>
</div>
<script src="common3500.js"></script>
<script src="fontpage.js"></script>
</body>
</html>
